<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>InternTrack — Interns</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-badge">🎓</div>
    <h2>InternTrack</h2>
    <span>Management Platform</span>
  </div>
  <nav class="sidebar-nav">
    <div class="section-title">Main</div>
    <a class="nav-item" href="/dashboard.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      Dashboard
    </a>
    <a class="nav-item active" href="/interns.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      Interns
    </a>
    <div class="section-title" style="margin-top:8px">Analytics</div>
    <a class="nav-item" href="/performance.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>
      Performance
    </a>
    <a class="nav-item" href="/feedback.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </span>
      Feedback
    </a>
    <a class="nav-item" href="/recommendations.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      Recommendations
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="ua">AD</div>
      <div>
        <div class="uname">Admin</div>
        <div class="urole">Administrator</div>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button id="hamburger" aria-label="Menu">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="breadcrumb">
        <div class="crumb-icon">
          <svg width="16" height="16" fill="none" stroke="#6366f1" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <h1>Interns</h1>
      </div>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge" id="topbar-count"></span>
      <button class="btn btn-primary" onclick="openAddIntern()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Intern
      </button>
    </div>
  </div>

  <div class="content">
    <div class="card" style="padding:0;overflow:visible">
      <div class="filters-bar">
        <div class="search-wrap" style="flex:1;min-width:180px">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="intern-search" placeholder="Search by name or email…" oninput="filterInterns()"/>
        </div>
        <select id="dept-filter" onchange="filterInterns()" style="width:auto">
          <option value="">All Departments</option>
        </select>
        <select id="status-filter" onchange="filterInterns()" style="width:auto">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="terminated">Terminated</option>
        </select>
      </div>
    </div>

    <div class="intern-cards" id="intern-cards">
      <div style="grid-column:1/-1;display:flex;justify-content:center;padding:40px"><div class="spinner"></div></div>
    </div>
  </div>
</main>

<!-- MODAL: Intern -->
<div class="modal-backdrop" id="modal-intern">
  <div class="modal">
    <div class="modal-header">
      <h2 id="intern-modal-title">Add Intern</h2>
      <button class="btn-icon" onclick="closeModal('modal-intern')">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="intern-form" class="form-grid">
        <input type="hidden" id="intern-id"/>
        <div class="form-group"><label>First Name *</label><input id="fi-first" placeholder="Alex" required/></div>
        <div class="form-group"><label>Last Name *</label><input id="fi-last" placeholder="Johnson" required/></div>
        <div class="form-group"><label>Email *</label><input id="fi-email" type="email" placeholder="alex@example.com" required/></div>
        <div class="form-group"><label>Phone</label><input id="fi-phone" placeholder="+1 (555) 000-0000"/></div>
        <div class="form-group">
          <label>Department *</label>
          <select id="fi-dept" required>
            <option value="">Select department…</option>
            <option>Engineering</option><option>Marketing</option><option>Data Science</option>
            <option>Product</option><option>Design</option><option>Finance</option>
            <option>HR</option><option>Operations</option>
          </select>
        </div>
        <div class="form-group"><label>Supervisor</label><input id="fi-supervisor" placeholder="Manager name"/></div>
        <div class="form-group"><label>Start Date *</label><input id="fi-start" type="date" required/></div>
        <div class="form-group"><label>End Date</label><input id="fi-end" type="date"/></div>
        <div class="form-group"><label>University</label><input id="fi-university" placeholder="MIT, Stanford…"/></div>
        <div class="form-group"><label>Major</label><input id="fi-major" placeholder="Computer Science"/></div>
        <div class="form-group" id="fi-status-group" style="display:none">
          <label>Status</label>
          <select id="fi-status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="terminated">Terminated</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-intern')">Cancel</button>
      <button class="btn btn-primary" onclick="saveIntern()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Save Intern
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/common.js"></script>
<script src="/js/interns.js"></script>
</body>
</html>
