<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>InternTrack — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-badge">🎓</div>
    <h2>InternTrack</h2>
    <span>Management Platform</span>
  </div>
  <nav class="sidebar-nav">
    <div class="section-title">Main</div>
    <a class="nav-item active" href="/dashboard.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      Dashboard
    </a>
    <a class="nav-item" href="/interns.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      Interns
    </a>
    <div class="section-title" style="margin-top:8px">Analytics</div>
    <a class="nav-item" href="/performance.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>
      Performance
    </a>
    <a class="nav-item" href="/feedback.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </span>
      Feedback
    </a>
    <a class="nav-item" href="/recommendations.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      Recommendations
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="ua">AD</div>
      <div>
        <div class="uname">Admin</div>
        <div class="urole">Administrator</div>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button id="hamburger" aria-label="Menu">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="breadcrumb">
        <div class="crumb-icon">
          <svg width="16" height="16" fill="none" stroke="#6366f1" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <h1>Dashboard</h1>
      </div>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge" id="topbar-count"></span>
      <a href="/interns.html" class="btn btn-primary">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        View All Interns
      </a>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card c1"><div class="spinner"></div></div>
    </div>

    <div class="two-col dash-section">
      <div class="card">
        <div class="card-header">
          <h3>🏆 Top Performers</h3>
        </div>
        <div class="card-body" id="top-performers">
          <div class="spinner"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>📊 By Department</h3>
        </div>
        <div class="card-body" id="dept-breakdown">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>🕐 Recent Interns</h3>
      </div>
      <div class="table-wrap">
        <table id="recent-table">
          <thead><tr><th>Intern</th><th>Department</th><th>Status</th><th>Avg Score</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
