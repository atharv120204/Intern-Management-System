<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>InternTrack — Recommendations</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-badge">🎓</div>
    <h2>InternTrack</h2>
    <span>Management Platform</span>
  </div>
  <nav class="sidebar-nav">
    <div class="section-title">Main</div>
    <a class="nav-item" href="/dashboard.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      Dashboard
    </a>
    <a class="nav-item" href="/interns.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      Interns
    </a>
    <div class="section-title" style="margin-top:8px">Analytics</div>
    <a class="nav-item" href="/performance.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>
      Performance
    </a>
    <a class="nav-item" href="/feedback.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </span>
      Feedback
    </a>
    <a class="nav-item active" href="/recommendations.html">
      <span class="nav-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </span>
      Recommendations
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="ua">AD</div>
      <div>
        <div class="uname">Admin</div>
        <div class="urole">Administrator</div>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button id="hamburger" aria-label="Menu">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="breadcrumb">
        <div class="crumb-icon">
          <svg width="16" height="16" fill="none" stroke="#6366f1" stroke-width="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <h1>Recommendations</h1>
      </div>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge" id="topbar-count"></span>
      <button class="btn btn-success" onclick="generateRec()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Generate
      </button>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">
        <h3>Recommendations</h3>
        <select id="rec-intern-select" onchange="loadRecommendationsForIntern()" style="width:auto">
          <option value="">Select Intern…</option>
        </select>
      </div>
      <div id="rec-content">
        <div class="empty-state">
          <div class="es-icon">
            <svg width="26" height="26" fill="none" stroke="#94a3b8" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <h3>No intern selected</h3>
          <p>Select an intern, then click Generate to auto-create a recommendation.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- MODAL: Recommendation -->
<div class="modal-backdrop" id="modal-rec">
  <div class="modal">
    <div class="modal-header">
      <h2>Save Recommendation</h2>
      <button class="btn-icon" onclick="closeModal('modal-rec')">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="gen-box" id="gen-preview"></div>
      <form id="rec-form" class="form-grid">
        <input type="hidden" id="rec-intern-id"/>
        <div class="form-group"><label>Recommended By *</label><input id="rec-by" placeholder="Your name" required/></div>
        <div class="form-group"><label>Date *</label><input id="rec-date" type="date" required/></div>
        <div class="form-group">
          <label>Recommendation Type</label>
          <select id="rec-type">
            <option value="full_time">Full-Time Hire</option>
            <option value="extend">Extend Internship</option>
            <option value="decline">Decline</option>
            <option value="pending">Pending</option>
          </select>
        </div>
        <div class="form-group">
          <label>Rating</label>
          <select id="rec-rating">
            <option value="exceptional">Exceptional</option>
            <option value="strong">Strong</option>
            <option value="adequate">Adequate</option>
            <option value="below_expectations">Below Expectations</option>
          </select>
        </div>
        <div class="form-group full"><label>Strengths</label><textarea id="rec-strengths" placeholder="Key strengths…"></textarea></div>
        <div class="form-group full"><label>Areas for Improvement</label><textarea id="rec-improve" placeholder="Growth areas…"></textarea></div>
        <div class="form-group full"><label>Summary *</label><textarea id="rec-summary" placeholder="Overall recommendation summary…" required></textarea></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-rec')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRecommendation()">Save Recommendation</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/common.js"></script>
<script src="/js/recommendations.js"></script>
</body>
</html>
